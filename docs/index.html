<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Theory Visualizer</title>
    <meta
      name="description"
      content="Interactive finite-group and symmetry explorer using WASM math, Three.js, and graph visualization."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f6f2e9;
      }

      main {
        width: min(680px, calc(100vw - 48px));
      }

      a {
        color: #70d6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Group Theory Visualizer</h1>
      <p>
        Initial GitHub Pages scaffold is live. The interactive visualizer is
        being built in public.
      </p>
      <p>
        Repo:
        <a href="https://github.com/baditaflorin/group-theory-visualizer"
          >https://github.com/baditaflorin/group-theory-visualizer</a
        >
      </p>
    </main>
  </body>
</html>
